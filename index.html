<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Supernode Modular Display Console</title>
  <meta name="description" content="Supernode Modular Display Console - Hardware-styled multi-tier responsive operational console framework">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bezel-hi: #2b3945;
      --bezel: #1b252e;
      --bezel-lo: #0f151a;
      --screen-bg: #090e13;
      --screen-bg-2: #0d151c;
      --card-bg: rgba(18, 28, 36, 0.72);
      --card-hover: rgba(26, 40, 52, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #475569;
      --accent-blue: #38bdf8;
      --accent-green: #34d399;
      --accent-amber: #fbbf24;
      
      --rh-row1: 1.0;
      --rh-row2: 1.0;
      --rh-row3: 1.0;
      
      --r1-w1: 1;
      --r1-w2: 1;
      --r1-w3: 1;
      
      --r2-w1: 1;
      --r2-w2: 1;
      --r2-w3: 1;

      --r3-w1: 1;
      --r3-w2: 1;
      --r3-w3: 1;
    }

    *{
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body{
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #04070a;
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      padding: 8px;
    }

    /* Overall Hardware Casing - Perfectly Symmetrical Left and Right */
    .device{
      width: 100%;
      max-width: 1720px;
      height: calc(100vh - 16px);
      max-height: 980px;
      display: flex;
      flex-direction: column;
      background: linear-gradient(155deg, var(--bezel-hi), var(--bezel) 40%, var(--bezel-lo));
      border-radius: 16px;
      padding: 0 12px 12px 12px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -2px 6px rgba(0,0,0,0.3);
      overflow: hidden;
      position: relative;
    }

    /* Top Chassis Header Strip */
    .device-header-strip{
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      user-select: none;
      position: relative;
    }
    .brand-group{
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .brand-name{
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .brand-version-tag{
      font-family: 'JetBrains Mono', monospace;
      font-size: 7.5px;
      font-weight: 600;
      color: var(--accent-blue);
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.22);
      border-radius: 4px;
      padding: 1px 5px;
      letter-spacing: 0.04em;
      line-height: 1.2;
    }

    /* Veil Selector 3 Dots */
    .veil-dots-container{
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      gap: 13px;
      z-index: 10;
      padding: 3px 12px;
      background: rgba(0, 0, 0, 0.45);
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.7);
    }
    .veil-dot{
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #475569;
      border: 1px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      padding: 0;
      margin: 0;
      outline: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.6);
      position: relative;
      user-select: none;
      touch-action: none;
    }
    .veil-dot::after{
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
    }
    .veil-dot:hover:not(:disabled){
      background: #94a3b8;
      border-color: rgba(255, 255, 255, 0.5);
      transform: scale(1.25);
    }
    .veil-dot.active{
      background: var(--accent-blue);
      border-color: #e0f2fe;
      box-shadow: 0 0 9px rgba(56, 189, 248, 0.85), inset 0 0 2px #fff;
      transform: scale(1.22);
    }
    .veil-dot.is-pressing{
      transform: scale(0.92) !important;
      background: var(--accent-amber) !important;
      border-color: #fef08a !important;
      box-shadow: 0 0 12px rgba(251, 191, 36, 0.9), inset 0 0 2px #fff !important;
    }
    .veil-dot.is-equalized{
      animation: dotEqualizePulse 0.45s ease-out !important;
    }
    @keyframes dotEqualizePulse{
      0%{ transform: scale(1.6); box-shadow: 0 0 18px rgba(52, 211, 153, 1); background: var(--accent-green); }
      100%{ transform: scale(1.22); box-shadow: 0 0 9px rgba(56, 189, 248, 0.85); background: var(--accent-blue); }
    }
    .veil-dot:disabled{
      opacity: 0.22;
      cursor: not-allowed;
      border-color: transparent;
      box-shadow: none;
    }

    .brand-ver{
      font-family: 'JetBrains Mono', monospace;
      font-size: 7.5px;
      letter-spacing: 0.08em;
      color: var(--text-dim);
    }

    .device-body{
      display: flex;
      flex-direction: row;
      align-items: stretch;
      flex: 1 1 auto;
      height: calc(100% - 22px);
      min-height: 0;
      width: 100%;
      position: relative;
    }

    /* The Screen Area - Symmetrical in Casing */
    .screen{
      position: relative;
      flex: 1 1 auto;
      height: 100%;
      min-height: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: stretch;
      background: radial-gradient(120% 140% at 50% 0%, var(--screen-bg-2), var(--screen-bg) 70%);
      border-radius: 10px;
      border: 1px solid #000;
      box-shadow: inset 0 0 40px rgba(0,0,0,0.9), inset 0 0 2px #000;
      padding: clamp(6px, 1.2vh, 12px) clamp(8px, 1.2vw, 14px) clamp(6px, 1vh, 10px) clamp(8px, 1.2vw, 14px);
      overflow: hidden;
    }

    /* Veils Viewport System */
    .veil-viewport{
      width: 100%;
      height: 100%;
      min-height: 0;
      flex: 1 1 auto;
      display: none !important;
      position: relative;
    }
    .veil-viewport.active{
      display: flex !important;
    }

    /* ==================== NOVA VEIL STYLES ==================== */
    #veilNova{
      flex-direction: column;
      justify-content: stretch;
      gap: 0;
    }

    .screen-row{
      width: 100%;
      min-height: 48px;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      justify-content: stretch;
      gap: 0;
      position: relative;
      overflow: hidden;
      transition: flex 0.25s cubic-bezier(0.16, 1, 0.3, 1), min-height 0.25s ease, max-height 0.25s ease;
    }

    #veilNova.is-resetting .screen-row,
    #veilNova.is-resetting .tile-card,
    #veilNova.is-resetting .tier-splitter,
    #veilNova.is-resetting .col-splitter{
      transition: all 0.26s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }

    #row1{ flex: var(--rh-row1, 1.0) 1 0px !important; }
    #row2{ flex: var(--rh-row2, 1.0) 1 0px !important; }
    #row3{ flex: var(--rh-row3, 1.0) 1 0px !important; }

    .tier-splitter{
      flex: 0 0 6px;
      height: 6px;
      min-height: 6px;
      max-height: 6px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: row-resize;
      user-select: none;
      z-index: 10;
      transition: background 0.15s ease;
    }
    .tier-splitter:hover, .tier-splitter.is-dragging{
      background: rgba(255, 255, 255, 0.08);
    }
    .tier-splitter-grip{
      width: 48px;
      height: 2px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 1px;
      transition: background 0.15s ease, width 0.15s ease;
    }
    .tier-splitter:hover .tier-splitter-grip, .tier-splitter.is-dragging .tier-splitter-grip{
      background: #cbd5e1;
      width: 64px;
    }

    .col-splitter{
      flex: 0 0 6px;
      width: 6px;
      min-width: 6px;
      max-width: 6px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: col-resize;
      user-select: none;
      z-index: 10;
      transition: background 0.15s ease;
    }
    .col-splitter:hover, .col-splitter.is-dragging{
      background: rgba(255, 255, 255, 0.08);
    }
    .col-splitter-grip{
      width: 2px;
      height: 32px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 1px;
      transition: background 0.15s ease, height 0.15s ease;
    }
    .col-splitter:hover .col-splitter-grip, .col-splitter.is-dragging .col-splitter-grip{
      background: #cbd5e1;
      height: 48px;
    }

    #panel1A{ flex: var(--r1-w1, 1) 1 0px; min-width: 0; width: 0; }
    #panel1B{ flex: var(--r1-w2, 1) 1 0px; min-width: 0; width: 0; }
    #panel1C{ flex: var(--r1-w3, 1) 1 0px; min-width: 0; width: 0; }

    #panel2A{ flex: var(--r2-w1, 1) 1 0px; min-width: 0; width: 0; }
    #panel2B{ flex: var(--r2-w2, 1) 1 0px; min-width: 0; width: 0; }
    #panel2C{ flex: var(--r2-w3, 1) 1 0px; min-width: 0; width: 0; }

    #panel3A{ flex: var(--r3-w1, 1) 1 0px; min-width: 0; width: 0; }
    #panel3B{ flex: var(--r3-w2, 1) 1 0px; min-width: 0; width: 0; }
    #panel3C{ flex: var(--r3-w3, 1) 1 0px; min-width: 0; width: 0; }

    /* ==================== QUAD VEIL STYLES ==================== */
    #veilQuad{
      position: relative;
      overflow: hidden;
      --quad-x: 50%;
      --quad-y: 50%;
    }
    #veilQuad.active{
      display: block !important;
    }

    #quadPanel1{
      position: absolute;
      left: 0;
      top: 0;
      width: calc(var(--quad-x) - 3px);
      height: calc(var(--quad-y) - 3px);
    }
    #quadPanel2{
      position: absolute;
      left: calc(var(--quad-x) + 3px);
      top: 0;
      right: 0;
      height: calc(var(--quad-y) - 3px);
    }
    #quadPanel3{
      position: absolute;
      left: 0;
      top: calc(var(--quad-y) + 3px);
      width: calc(var(--quad-x) - 3px);
      bottom: 0;
    }
    #quadPanel4{
      position: absolute;
      left: calc(var(--quad-x) + 3px);
      top: calc(var(--quad-y) + 3px);
      right: 0;
      bottom: 0;
    }

    .cross-splitter-v{
      position: absolute;
      top: 0;
      bottom: 0;
      left: calc(var(--quad-x) - 3px);
      width: 6px;
      cursor: col-resize;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease;
      user-select: none;
    }
    .cross-splitter-v:hover, .cross-splitter-v.is-dragging{
      background: rgba(255, 255, 255, 0.08);
    }
    .cross-splitter-v-grip{
      width: 2px;
      height: 36px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 1px;
    }

    .cross-splitter-h{
      position: absolute;
      left: 0;
      right: 0;
      top: calc(var(--quad-y) - 3px);
      height: 6px;
      cursor: row-resize;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease;
      user-select: none;
    }
    .cross-splitter-h:hover, .cross-splitter-h.is-dragging{
      background: rgba(255, 255, 255, 0.08);
    }
    .cross-splitter-h-grip{
      height: 2px;
      width: 36px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 1px;
    }

    .cross-splitter-hub{
      position: absolute;
      left: var(--quad-x);
      top: var(--quad-y);
      transform: translate(-50%, -50%);
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: transparent;
      border: 1.5px solid transparent;
      box-shadow: none;
      cursor: pointer;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #768793;
      user-select: none;
      touch-action: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease, background 0.2s ease, color 0.2s ease;
    }
    .cross-splitter-hub:hover{
      color: #cbd5e1;
    }
    .cross-splitter-hub.is-pressing{
      border-color: rgba(251, 191, 36, 0.75);
      background: rgba(24, 20, 12, 0.85);
      color: var(--accent-amber);
      box-shadow: 0 0 12px rgba(251, 191, 36, 0.5), inset 0 0 4px #fbbf24;
      transform: translate(-50%, -50%) scale(0.95);
    }
    .cross-splitter-hub.is-active-drag{
      cursor: all-scroll !important;
      border-color: #38bdf8;
      background: #082f49;
      color: #38bdf8;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.8), inset 0 0 6px #e0f2fe;
      transform: translate(-50%, -50%) scale(1.22) !important;
    }
    .hub-ring{
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid transparent;
      pointer-events: none;
    }
    .cross-splitter-hub.is-pressing .hub-ring{
      border-color: rgba(251, 191, 36, 0.5);
      animation: hubPulse 0.3s ease infinite alternate;
    }
    .cross-splitter-hub.is-active-drag .hub-ring{
      border-color: rgba(56, 189, 248, 0.7);
      animation: hubSpin 2s linear infinite;
    }
    @keyframes hubPulse{
      from{ transform: scale(1); opacity: 0.5; }
      to{ transform: scale(1.28); opacity: 1; }
    }
    @keyframes hubSpin{
      from{ transform: rotate(0deg); }
      to{ transform: rotate(360deg); }
    }

    #veilQuad.is-resetting #quadPanel1,
    #veilQuad.is-resetting #quadPanel2,
    #veilQuad.is-resetting #quadPanel3,
    #veilQuad.is-resetting #quadPanel4,
    #veilQuad.is-resetting .cross-splitter-v,
    #veilQuad.is-resetting .cross-splitter-h,
    #veilQuad.is-resetting .cross-splitter-hub{
      transition: all 0.26s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }

    /* ==================== TRIDENT VEIL STYLES ==================== */
    #veilTrident{
      display: none;
      flex-direction: row;
      align-items: stretch;
      justify-content: stretch;
      gap: 0;
      position: relative;
      overflow: hidden;
      --tri-w1: 1;
      --tri-w2: 1;
      --tri-w3: 1;
    }
    #veilTrident.active{
      display: flex !important;
    }

    #tridentPanel1{ flex: var(--tri-w1, 1) 1 0px; min-width: 0; width: 0; }
    #tridentPanel2{ flex: var(--tri-w2, 1) 1 0px; min-width: 0; width: 0; }
    #tridentPanel3{ flex: var(--tri-w3, 1) 1 0px; min-width: 0; width: 0; }

    #veilTrident.is-resetting #tridentPanel1,
    #veilTrident.is-resetting #tridentPanel2,
    #veilTrident.is-resetting #tridentPanel3,
    #veilTrident.is-resetting .col-splitter{
      transition: all 0.26s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }

    /* ==================== CANVAS VEIL STYLES ==================== */
    #veilCanvas{
      display: none;
      width: 100%;
      height: 100%;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }
    #veilCanvas.active{
      display: flex !important;
    }
    #canvasPanel1{
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      flex: 1 1 auto;
    }

    .canvas-crosshair-hub{
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: transparent;
      border: 1.5px solid transparent;
      box-shadow: none;
      cursor: default;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #768793;
      user-select: none;
      touch-action: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease, background 0.2s ease, color 0.2s ease;
    }
    .canvas-crosshair-hub:hover{
      color: #cbd5e1;
      border-color: rgba(56, 189, 248, 0.4);
      background: rgba(8, 47, 73, 0.5);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
      cursor: pointer;
    }
    .canvas-crosshair-hub:active{
      transform: translate(-50%, -50%) scale(1.15);
      border-color: #38bdf8;
      color: #e0f2fe;
      background: #082f49;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.7);
    }

    /* Common Card Styling */
    .tile-card{
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    .tile-card:hover{
      border-color: rgba(255, 255, 255, 0.14);
      background: var(--card-hover);
    }

    .tile-header{
      height: 26px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(0, 0, 0, 0.18);
      user-select: none;
    }
    .tile-title{
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .tile-body{
      flex: 1 1 auto;
      height: 100%;
      min-height: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
  </style>
</head>
<body>

<div class="device" id="supernodeDevice">
  
  <!-- Top Chassis Header Strip with 4 Dots Veil Selector -->
  <div class="device-header-strip">
    <div class="brand-group">
      <span class="brand-name">SUPERNODE FRAMEWORK</span>
      <span class="brand-version-tag">v1.10192026.1322</span>
    </div>
    <div class="veil-dots-container" id="veilDotsContainer">
      <button type="button" class="veil-dot active" data-veil="nova" title="Veil: Nova (Click to switch, Long-press to equalize)" aria-label="Veil: Nova (Click to switch, Long-press to equalize)"></button>
      <button type="button" class="veil-dot" data-veil="quad" title="Veil: Quad (Click to switch, Long-press to equalize)" aria-label="Veil: Quad (Click to switch, Long-press to equalize)"></button>
      <button type="button" class="veil-dot" data-veil="trident" title="Veil: Trident (Click to switch, Long-press to equalize)" aria-label="Veil: Trident (Click to switch, Long-press to equalize)"></button>
      <button type="button" class="veil-dot" data-veil="canvas" title="Veil: Canvas (Single Canvas View)" aria-label="Veil: Canvas (Single Canvas View)"></button>
    </div>
    <span class="brand-ver" id="brandStatus">VEIL: NOVA • 9-PANEL</span>
  </div>

  <div class="device-body" id="deviceBody">
    
    <!-- Main Screen Display -->
    <div class="screen" id="screen">
      
      <!-- ==================== VEIL 1: NOVA (9-PANEL 3x3 MATRIX) ==================== -->
      <div class="veil-viewport active" id="veilNova">
        
        <!-- TIER ROW 1 (3-COLUMNS FULL WIDTH) -->
        <div class="screen-row" id="row1">
          <div class="tile-card" id="panel1A">
            <div class="tile-header">
              <span class="tile-title">1</span>
            </div>
            <div class="tile-body" id="body1A"></div>
          </div>

          <div class="col-splitter" data-row="row1" data-seam="0" role="separator" aria-orientation="vertical" title="Drag to resize width">
            <div class="col-splitter-grip"></div>
          </div>

          <div class="tile-card" id="panel1B">
            <div class="tile-header">
              <span class="tile-title">2</span>
            </div>
            <div class="tile-body" id="body1B"></div>
          </div>

          <div class="col-splitter" data-row="row1" data-seam="1" role="separator" aria-orientation="vertical" title="Drag to resize width">
            <div class="col-splitter-grip"></div>
          </div>

          <div class="tile-card" id="panel1C">
            <div class="tile-header">
              <span class="tile-title">3</span>
            </div>
            <div class="tile-body" id="body1C"></div>
          </div>
        </div>

        <!-- TIER SPLITTER 0 -->
        <div class="tier-splitter" id="tierSplitter0" data-tier-seam="0" role="separator" aria-orientation="horizontal" title="Drag to resize tier heights">
          <div class="tier-splitter-grip"></div>
        </div>

        <!-- TIER ROW 2 (3-COLUMNS FULL WIDTH) -->
        <div class="screen-row" id="row2">
          <div class="tile-card" id="panel2A">
            <div class="tile-header">
              <span class="tile-title">4</span>
            </div>
            <div class="tile-body" id="body2A"></div>
          </div>

<script>
(function(){
  'use strict';

  /* ==================== NOVA VEIL ROW & COL LOGIC ==================== */
  const VALID_ROW_IDS = ['row1', 'row2', 'row3'];
  const DEFAULT_ROW_HEIGHTS = { row1: 1.0, row2: 1.0, row3: 1.0 };
  const DEFAULT_COL_WEIGHTS = [1, 1, 1];

  function loadRowHeights(){
    try {
      const saved = JSON.parse(localStorage.getItem('supernode_row_heights'));
      if(saved && typeof saved === 'object' && VALID_ROW_IDS.every(id => typeof saved[id] === 'number')){
        return saved;
      }
    } catch(e){}
    return { ...DEFAULT_ROW_HEIGHTS };
  }

  let currentRowHeights = loadRowHeights();

  function applyRowHeights(weights){
    VALID_ROW_IDS.forEach(id => {
      const val = (weights && weights[id] !== undefined) ? weights[id] : DEFAULT_ROW_HEIGHTS[id];
      document.documentElement.style.setProperty(`--rh-${id}`, String(val));
    });
  }

  applyRowHeights(currentRowHeights);

  function loadColWeights(rowKey){
    try {
      const saved = JSON.parse(localStorage.getItem(`supernode_${rowKey}_weights`));
      if(Array.isArray(saved) && saved.length === 3 && saved.every(n => typeof n === 'number' && n > 0.05)){
        return saved;
      }
    } catch(e){}
    return [...DEFAULT_COL_WEIGHTS];
  }

  const colWeights = {
    row1: loadColWeights('row1'),
    row2: loadColWeights('row2'),
    row3: loadColWeights('row3')
  };

  function applyColWeights(rowKey, weights){
    const prefix = rowKey === 'row1' ? '--r1-w' : (rowKey === 'row2' ? '--r2-w' : '--r3-w');
    document.documentElement.style.setProperty(`${prefix}1`, String(weights[0]));
    document.documentElement.style.setProperty(`${prefix}2`, String(weights[1]));
    document.documentElement.style.setProperty(`${prefix}3`, String(weights[2]));
  }

  applyColWeights('row1', colWeights.row1);
  applyColWeights('row2', colWeights.row2);
  applyColWeights('row3', colWeights.row3);

  function resetNova(){
    currentRowHeights = { ...DEFAULT_ROW_HEIGHTS };
    applyRowHeights(currentRowHeights);
    try {
      localStorage.setItem('supernode_row_heights', JSON.stringify(currentRowHeights));
    } catch(err){}

    VALID_ROW_IDS.forEach(rowKey => {
      colWeights[rowKey] = [...DEFAULT_COL_WEIGHTS];
      applyColWeights(rowKey, colWeights[rowKey]);
      try {
        localStorage.setItem(`supernode_${rowKey}_weights`, JSON.stringify(colWeights[rowKey]));
      } catch(err){}
    });

    const novaEl = document.getElementById('veilNova');
    if(novaEl){
      novaEl.classList.add('is-resetting');
      setTimeout(() => novaEl.classList.remove('is-resetting'), 270);
    }
  }

  function initTierSplitters(){
    const splitters = document.querySelectorAll('.tier-splitter');

    splitters.forEach(sp => {
      sp.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        sp.classList.add('is-dragging');
        sp.setPointerCapture(e.pointerId);

        const startY = e.clientY;
        const seamIdx = parseInt(sp.dataset.tierSeam, 10);
        
        const rowAboveId = VALID_ROW_IDS[seamIdx];
        const rowBelowId = VALID_ROW_IDS[seamIdx + 1];
        if(!rowAboveId || !rowBelowId) return;

        const rowAboveEl = document.getElementById(rowAboveId);
        const rowBelowEl = document.getElementById(rowBelowId);
        const initialAboveHeight = rowAboveEl.offsetHeight;
        const initialBelowHeight = rowBelowEl.offsetHeight;
        const totalH = initialAboveHeight + initialBelowHeight;

        const onPointerMove = (ev) => {
          const dy = ev.clientY - startY;
          let newAboveH = initialAboveHeight + dy;
          let newBelowH = initialBelowHeight - dy;

          const minH = 50;
          if(newAboveH < minH){ newAboveH = minH; newBelowH = totalH - minH; }
          if(newBelowH < minH){ newBelowH = minH; newAboveH = totalH - minH; }

          const ratioAbove = newAboveH / totalH;
          const ratioBelow = newBelowH / totalH;
          const sumWeights = currentRowHeights[rowAboveId] + currentRowHeights[rowBelowId];

          currentRowHeights[rowAboveId] = +(sumWeights * ratioAbove).toFixed(3);
          currentRowHeights[rowBelowId] = +(sumWeights * ratioBelow).toFixed(3);

          applyRowHeights(currentRowHeights);
        };

        const onPointerUp = (ev) => {
          sp.classList.remove('is-dragging');
          try { sp.releasePointerCapture(ev.pointerId); } catch(err){}
          window.removeEventListener('pointermove', onPointerMove);
          window.removeEventListener('pointerup', onPointerUp);
          try {
            localStorage.setItem('supernode_row_heights', JSON.stringify(currentRowHeights));
          } catch(err){}
        };

        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);
      });

      sp.addEventListener('dblclick', () => {
        currentRowHeights = { ...DEFAULT_ROW_HEIGHTS };
        applyRowHeights(currentRowHeights);
        try {
          localStorage.setItem('supernode_row_heights', JSON.stringify(currentRowHeights));
        } catch(err){}
      });
    });
  }

  function initColSplitters(){
    const colSplitters = document.querySelectorAll('.col-splitter');

    colSplitters.forEach(sp => {
      sp.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        sp.classList.add('is-dragging');
        sp.setPointerCapture(e.pointerId);

        const rowKey = sp.dataset.row;
        const seamIdx = parseInt(sp.dataset.seam, 10);
        const startX = e.clientX;

        const rowEl = document.getElementById(rowKey);
        const cards = rowEl.querySelectorAll('.tile-card');
        const cardA = cards[seamIdx];
        const cardB = cards[seamIdx + 1];

        const initialW_A = cardA.offsetWidth;
        const initialW_B = cardB.offsetWidth;
        const totalW = initialW_A + initialW_B;

        const onPointerMove = (ev) => {
          const dx = ev.clientX - startX;
          let newW_A = initialW_A + dx;
          let newW_B = initialW_B - dx;

          const minW = 60;
          if(newW_A < minW){ newW_A = minW; newW_B = totalW - minW; }
          if(newW_B < minW){ newW_B = minW; newW_A = totalW - minW; }

          const ratioA = newW_A / totalW;
          const ratioB = newW_B / totalW;
          const sumW = colWeights[rowKey][seamIdx] + colWeights[rowKey][seamIdx + 1];

          colWeights[rowKey][seamIdx] = +(sumW * ratioA).toFixed(3);
          colWeights[rowKey][seamIdx + 1] = +(sumW * ratioB).toFixed(3);

          applyColWeights(rowKey, colWeights[rowKey]);
        };

        const onPointerUp = (ev) => {
          sp.classList.remove('is-dragging');
          try { sp.releasePointerCapture(ev.pointerId); } catch(err){}
          window.removeEventListener('pointermove', onPointerMove);
          window.removeEventListener('pointerup', onPointerUp);
          try {
            localStorage.setItem(`supernode_${rowKey}_weights`, JSON.stringify(colWeights[rowKey]));
          } catch(err){}
        };

        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);
      });

      sp.addEventListener('dblclick', () => {
        const rowKey = sp.dataset.row;
        colWeights[rowKey] = [...DEFAULT_COL_WEIGHTS];
        applyColWeights(rowKey, colWeights[rowKey]);
        try {
          localStorage.setItem(`supernode_${rowKey}_weights`, JSON.stringify(colWeights[rowKey]));
        } catch(err){}
      });
    });
  }

  /* ==================== VEIL SWITCHING SYSTEM ==================== */
  const VALID_VEILS = ['nova', 'quad', 'trident', 'canvas'];
  let currentActiveVeil = 'nova';
  try {
    const savedVeil = localStorage.getItem('supernode_active_veil');
    if (VALID_VEILS.includes(savedVeil)) {
      currentActiveVeil = savedVeil;
    }
  } catch(e){}

  function switchVeil(veilName){
    if(!VALID_VEILS.includes(veilName)) return;
    currentActiveVeil = veilName;
    try {
      localStorage.setItem('supernode_active_veil', currentActiveVeil);
    } catch(e){}

    const vNova = document.getElementById('veilNova');
    const vQuad = document.getElementById('veilQuad');
    const vTrident = document.getElementById('veilTrident');
    const vCanvas = document.getElementById('veilCanvas');
    const dots = document.querySelectorAll('.veil-dot');
    const status = document.getElementById('brandStatus');

    if(vNova) vNova.classList.toggle('active', veilName === 'nova');
    if(vQuad) vQuad.classList.toggle('active', veilName === 'quad');
    if(vTrident) vTrident.classList.toggle('active', veilName === 'trident');
    if(vCanvas) vCanvas.classList.toggle('active', veilName === 'canvas');

    if(status){
      if(veilName === 'nova') status.textContent = 'VEIL: NOVA • 9-PANEL';
      else if(veilName === 'quad') status.textContent = 'VEIL: QUAD • 4-PANEL';
      else if(veilName === 'trident') status.textContent = 'VEIL: TRIDENT • 3-COLUMN';
      else if(veilName === 'canvas') status.textContent = 'VEIL: CANVAS • SINGLE CANVAS';
    }

    dots.forEach(d => {
      const target = d.dataset.veil;
      d.classList.toggle('active', target === veilName);
    });
  }

  function resetCanvas(){
    const canvasEl = document.getElementById('veilCanvas');
    if(canvasEl){
      canvasEl.classList.add('is-resetting');
      setTimeout(() => canvasEl.classList.remove('is-resetting'), 270);
    }
  }

  function initVeilSelector(){
    const dots = document.querySelectorAll('.veil-dot');
    dots.forEach(d => {
      let pressTimer = null;
      let isLongPress = false;
      let startX = 0;
      let startY = 0;

      d.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        d.setPointerCapture(e.pointerId);
        isLongPress = false;
        startX = e.clientX;
        startY = e.clientY;
        d.classList.add('is-pressing');

        pressTimer = setTimeout(() => {
          isLongPress = true;
          d.classList.remove('is-pressing');
          const target = d.dataset.veil;

          // Switch to veil if not active
          switchVeil(target);

          // Equalize veil sizing
          if(target === 'nova') resetNova();
          else if(target === 'quad') resetQuad();
          else if(target === 'trident') resetTrident();
          else if(target === 'canvas') resetCanvas();

          // Visual confirmation pulse
          d.classList.add('is-equalized');
          setTimeout(() => d.classList.remove('is-equalized'), 500);
        }, 420); // 420ms long-press threshold
      });

      d.addEventListener('pointermove', (e) => {
        if(!isLongPress && Math.hypot(e.clientX - startX, e.clientY - startY) > 8){
          clearTimeout(pressTimer);
          d.classList.remove('is-pressing');
        }
      });

      const onPointerEnd = (e) => {
        clearTimeout(pressTimer);
        d.classList.remove('is-pressing');
        try { d.releasePointerCapture(e.pointerId); } catch(err){}

        if(!isLongPress){
          const target = d.dataset.veil;
          if(VALID_VEILS.includes(target)){
            switchVeil(target);
          }
        }
      };

      d.addEventListener('pointerup', onPointerEnd);
      d.addEventListener('pointercancel', onPointerEnd);
    });
  }

  /* ==================== QUAD VEIL CROSS SPLITTER ==================== */
  function initQuadSplitter(){
    const quadEl = document.getElementById('veilQuad');
    const hub = document.getElementById('quadCrossHub');
    const splitV = document.getElementById('quadSplitV');
    const splitH = document.getElementById('quadSplitH');
    if(!quadEl || !hub) return;

    let savedSplit = { x: 50, y: 50 };
    try {
      const parsed = JSON.parse(localStorage.getItem('supernode_quad_split'));
      if(parsed && typeof parsed.x === 'number' && typeof parsed.y === 'number'){
        savedSplit = parsed;
      }
    } catch(e){}

    function setQuadSplit(pctX, pctY, smooth = false){
      pctX = Math.max(12, Math.min(88, pctX));
      pctY = Math.max(12, Math.min(88, pctY));
      if(smooth){
        quadEl.classList.add('is-resetting');
        setTimeout(() => quadEl.classList.remove('is-resetting'), 270);
      }
      quadEl.style.setProperty('--quad-x', `${pctX}%`);
      quadEl.style.setProperty('--quad-y', `${pctY}%`);
      savedSplit = { x: pctX, y: pctY };
    }

    setQuadSplit(savedSplit.x, savedSplit.y);

    function getBounds(){
      const rect = quadEl.getBoundingClientRect();
      const minW = 60; // minimum panel size matching Nova 3-cols
      const minH = 50; // minimum panel size matching Nova 3-rows
      const minX = minW;
      const maxX = Math.max(minW + 20, rect.width - minW);
      const minY = minH;
      const maxY = Math.max(minH + 20, rect.height - minH);
      return { rect, minX, maxX, minY, maxY };
    }

    function resetToEvenQuads(){
      setQuadSplit(50, 50, true);
      try {
        localStorage.setItem('supernode_quad_split', JSON.stringify({ x: 50, y: 50 }));
      } catch(err){}
    }

    window.resetQuad = resetToEvenQuads;

    // Direct multi-directional 2D drag on center cross hub (no long press delay)
    hub.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      hub.setPointerCapture(e.pointerId);
      hub.classList.add('is-active-drag');

      const onPointerMove = (ev) => {
        const { rect, minX, maxX, minY, maxY } = getBounds();
        const clientX = Math.max(rect.left + minX, Math.min(rect.left + maxX, ev.clientX));
        const clientY = Math.max(rect.top + minY, Math.min(rect.top + maxY, ev.clientY));

        const pctX = ((clientX - rect.left) / rect.width) * 100;
        const pctY = ((clientY - rect.top) / rect.height) * 100;
        setQuadSplit(+pctX.toFixed(2), +pctY.toFixed(2));
      };

      const onPointerUp = (ev) => {
        hub.classList.remove('is-active-drag');
        try { hub.releasePointerCapture(ev.pointerId); } catch(err){}
        window.removeEventListener('pointermove', onPointerMove);
        window.removeEventListener('pointerup', onPointerUp);
        try {
          localStorage.setItem('supernode_quad_split', JSON.stringify(savedSplit));
        } catch(err){}
      };

      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
    });

    // Vertical splitter track drag (X only)
    if(splitV){
      splitV.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        splitV.setPointerCapture(e.pointerId);
        splitV.classList.add('is-dragging');
        const onMove = (ev) => {
          const { rect, minX, maxX } = getBounds();
          const clientX = Math.max(rect.left + minX, Math.min(rect.left + maxX, ev.clientX));
          const pctX = ((clientX - rect.left) / rect.width) * 100;
          setQuadSplit(+pctX.toFixed(2), savedSplit.y);
        };
        const onUp = (ev) => {
          splitV.classList.remove('is-dragging');
          try { splitV.releasePointerCapture(ev.pointerId); } catch(err){}
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          try {
            localStorage.setItem('supernode_quad_split', JSON.stringify(savedSplit));
          } catch(err){}
        };
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
      });

      splitV.addEventListener('dblclick', (e) => {
        e.preventDefault();
        resetToEvenQuads();
      });
    }

    // Horizontal splitter track drag (Y only)
    if(splitH){
      splitH.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        splitH.setPointerCapture(e.pointerId);
        splitH.classList.add('is-dragging');
        const onMove = (ev) => {
          const { rect, minY, maxY } = getBounds();
          const clientY = Math.max(rect.top + minY, Math.min(rect.top + maxY, ev.clientY));
          const pctY = ((clientY - rect.top) / rect.height) * 100;
          setQuadSplit(savedSplit.x, +pctY.toFixed(2));
        };
        const onUp = (ev) => {
          splitH.classList.remove('is-dragging');
          try { splitH.releasePointerCapture(ev.pointerId); } catch(err){}
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          try {
            localStorage.setItem('supernode_quad_split', JSON.stringify(savedSplit));
          } catch(err){}
        };
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
      });

      splitH.addEventListener('dblclick', (e) => {
        e.preventDefault();
        resetToEvenQuads();
      });
    }

    // Double-click center hub resets to equal 50% / 50%
    hub.addEventListener('dblclick', (e) => {
      e.preventDefault();
      resetToEvenQuads();
    });
  }

  /* ==================== TRIDENT VEIL SPLITTER ==================== */
  function initTridentSplitters(){
    const tridentEl = document.getElementById('veilTrident');
    if(!tridentEl) return;

    let tridentWeights = [1, 1, 1];
    try {
      const saved = JSON.parse(localStorage.getItem('supernode_trident_weights'));
      if(Array.isArray(saved) && saved.length === 3 && saved.every(n => typeof n === 'number' && n > 0.05)){
        tridentWeights = saved;
      }
    } catch(e){}

    function applyTridentWeights(weights, smooth = false){
      if(smooth){
        tridentEl.classList.add('is-resetting');
        setTimeout(() => tridentEl.classList.remove('is-resetting'), 270);
      }
      tridentEl.style.setProperty('--tri-w1', String(weights[0]));
      tridentEl.style.setProperty('--tri-w2', String(weights[1]));
      tridentEl.style.setProperty('--tri-w3', String(weights[2]));
      tridentWeights = [...weights];
    }

    applyTridentWeights(tridentWeights);

    function resetTrident(){
      applyTridentWeights([1, 1, 1], true);
      try {
        localStorage.setItem('supernode_trident_weights', JSON.stringify([1, 1, 1]));
      } catch(err){}
    }
    window.resetTrident = resetTrident;

    const splitters = tridentEl.querySelectorAll('.col-splitter');
    splitters.forEach(sp => {
      sp.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        sp.classList.add('is-dragging');
        sp.setPointerCapture(e.pointerId);

        const seamIdx = parseInt(sp.dataset.tridentSeam, 10);
        const startX = e.clientX;

        const cards = tridentEl.querySelectorAll('.tile-card');
        const cardA = cards[seamIdx];
        const cardB = cards[seamIdx + 1];

        const initialW_A = cardA.offsetWidth;
        const initialW_B = cardB.offsetWidth;
        const totalW = initialW_A + initialW_B;

        const onPointerMove = (ev) => {
          const dx = ev.clientX - startX;
          let newW_A = initialW_A + dx;
          let newW_B = initialW_B - dx;

          const minW = 60;
          if(newW_A < minW){ newW_A = minW; newW_B = totalW - minW; }
          if(newW_B < minW){ newW_B = minW; newW_A = totalW - minW; }

          const ratioA = newW_A / totalW;
          const ratioB = newW_B / totalW;
          const sumW = tridentWeights[seamIdx] + tridentWeights[seamIdx + 1];

          tridentWeights[seamIdx] = +(sumW * ratioA).toFixed(3);
          tridentWeights[seamIdx + 1] = +(sumW * ratioB).toFixed(3);

          applyTridentWeights(tridentWeights);
        };

        const onPointerUp = (ev) => {
          sp.classList.remove('is-dragging');
          try { sp.releasePointerCapture(ev.pointerId); } catch(err){}
          window.removeEventListener('pointermove', onPointerMove);
          window.removeEventListener('pointerup', onPointerUp);
          try {
            localStorage.setItem('supernode_trident_weights', JSON.stringify(tridentWeights));
          } catch(err){}
        };

        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);
      });

      sp.addEventListener('dblclick', (e) => {
        e.preventDefault();
        resetTrident();
      });
    });
  }

  /* ==================== MODULE INITIALIZATION ==================== */
  function populateModules(){
    const modules = [
      { id: 'body1A', fn: window.NovaPanel1 },
      { id: 'body1B', fn: window.NovaPanel2 },
      { id: 'body1C', fn: window.NovaPanel3 },
      { id: 'body2A', fn: window.NovaPanel4 },
      { id: 'body2B', fn: window.NovaPanel5 },
      { id: 'body2C', fn: window.NovaPanel6 },
      { id: 'body3A', fn: window.NovaPanel7 },
      { id: 'body3B', fn: window.NovaPanel8 },
      { id: 'body3C', fn: window.NovaPanel9 },
      { id: 'quadBody1', fn: window.QuadPanel1 },
      { id: 'quadBody2', fn: window.QuadPanel2 },
      { id: 'quadBody3', fn: window.QuadPanel3 },
      { id: 'quadBody4', fn: window.QuadPanel4 },
      { id: 'tridentBody1', fn: window.TridentPanel1 },
      { id: 'tridentBody2', fn: window.TridentPanel2 },
      { id: 'tridentBody3', fn: window.TridentPanel3 },
      { id: 'canvasBody1', fn: window.CanvasPanel1 }
    ];

    modules.forEach(m => {
      const el = document.getElementById(m.id);
      if(!el) return;
      if(m.fn && typeof m.fn.init === 'function'){
        m.fn.init(el);
      }
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    initTierSplitters();
    initColSplitters();
    initVeilSelector();
    initQuadSplitter();
    initTridentSplitters();
    switchVeil(currentActiveVeil);
    populateModules();
  });

})();
</script>
